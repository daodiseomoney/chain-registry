# .github/workflows/test_endpoints.yml  (fork only)
name: Test DAODISEO endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - 'testnets/daodiseotestnet/**'
      - '.github/workflows/test_endpoints.yml'

jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Show DAODISEO endpoints
        run: |
          FILE="testnets/daodiseotestnet/chain.json"
          echo "Using $FILE"
          echo "RPC endpoints:"
          jq -r '.apis.rpc[].address'  "$FILE" || true
          echo "REST endpoints:"
          jq -r '.apis.rest[].address' "$FILE" || true

      - name: Probe RPC/REST endpoints (fail if any BAD)
        shell: bash
        run: |
          set -euo pipefail
          FILE="testnets/daodiseotestnet/chain.json"

          # Load endpoints into arrays (trim trailing spaces)
          mapfile -t RPCS  < <(jq -r '.apis.rpc[].address'  "$FILE" | sed 's/[[:space:]]\+$//')
          mapfile -t RESTS < <(jq -r '.apis.rest[].address' "$FILE" | sed 's/[[:space:]]\+$//')

          BAD=()

          echo
          echo "=== RPC checks (expect HTTP 200 at /status) ==="
          for URL in "${RPCS[@]}"; do
            [[ -z "${URL:-}" ]] && continue
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 15 "$URL/status" || echo "000")
            if [[ "$CODE" == "200" ]]; then
              echo "OK  $URL"
            else
              echo "BAD $URL ($CODE)"
              BAD+=("RPC $URL ($CODE)")
            fi
          done

          echo
          echo "=== REST checks (expect HTTP 200 at /cosmos/base/tendermint/v1beta1/syncing) ==="
          for URL in "${RESTS[@]}"; do
            [[ -z "${URL:-}" ]] && continue
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 15 "$URL/cosmos/base/tendermint/v1beta1/syncing" || echo "000")
            if [[ "$CODE" == "200" ]]; then
              echo "OK  $URL"
            else
              echo "BAD $URL ($CODE)"
              BAD+=("REST $URL ($CODE)")
            fi
          done

          echo
          echo "Summary:"
          echo "  RPC tested : ${#RPCS[@]}"
          echo "  REST tested: ${#RESTS[@]}"
          echo "  BAD count  : ${#BAD[@]}"

          if (( ${#BAD[@]} > 0 )); then
            echo
            echo "BAD endpoints:"
            printf '  - %s\n' "${BAD[@]}"
            exit 1
          fi



