# .github/workflows/test_endpoints.yml  (fork only)
name: Test RPC and LCD endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - 'testnets/daodiseotestnet/**'
      - '.github/workflows/test_endpoints.yml'

jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: pip install -r .github/workflows/tests/requirements.txt

      - name: Show DAODISEO endpoints
        run: |
          FILE="testnets/daodiseotestnet/chain.json"
          echo "Using $FILE"
          echo "RPC:"
          jq -r '.apis.rpc[].address'  "$FILE"
          echo "REST:"
          jq -r '.apis.rest[].address' "$FILE"

      - name: Run tests (DAODISEO only)
        run: pytest -n auto .github/workflows/tests -k daodiseotestnet -vv -s

