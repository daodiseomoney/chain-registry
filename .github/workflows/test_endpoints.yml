# .github/workflows/test_endpoints.yml  (fork only)
name: Test DAODISEO endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - 'testnets/daodiseotestnet/**'
      - '.github/workflows/test_endpoints.yml'

jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq and curl
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Show DAODISEO endpoints
        run: |
          FILE="testnets/daodiseotestnet/chain.json"
          echo "Using $FILE"
          echo "RPC endpoints:"
          jq -r '.apis.rpc[].address'  "$FILE" || true
          echo "REST endpoints:"
          jq -r '.apis.rest[].address' "$FILE" || true

      - name: Probe RPC/REST endpoints (fail if any BAD)
        run: |
          set +e
          FILE="testnets/daodiseotestnet/chain.json"
          FAIL=0

          echo ""
          echo "=== RPC checks (expect HTTP 200 at /status) ==="
          jq -r '.apis.rpc[].address' "$FILE" | sed 's/[[:space:]]\+$//' | while read -r URL; do
            [ -z "$URL" ] && continue
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 15 "$URL/status")
            if [ "$CODE" = "200" ]; then
              echo "OK  $URL"
            else
              echo "BAD $URL ($CODE)"
              FAIL=$((FAIL+1))
            fi
          done

          echo ""
          echo "=== REST checks (expect HTTP 200 at /cosmos/base/tendermint/v1beta1/syncing) ==="
          jq -r '.apis.rest[].address' "$FILE" | sed 's/[[:space:]]\+$//' | while read -r URL; do
            [ -z "$URL" ] && continue
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --connect-timeout 8 --max-time 15 "$URL/cosmos/base/tendermint/v1beta1/syncing")
            if [ "$CODE" = "200" ]; then
              echo "OK  $URL"
            else
              echo "BAD $URL ($CODE)"
              FAIL=$((FAIL+1))
            fi
          done

          echo ""
          echo "Failures: $FAIL"
          [ "$FAIL" -eq 0 ]

