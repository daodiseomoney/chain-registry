# .github/workflows/test_endpoints.yml  (fork only)
name: Test RPC and LCD endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - 'daodiseo/**'
      - '.github/workflows/test_endpoints.yml'

jobs:
  test-endpoints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r .github/workflows/tests/requirements.txt

      - name: Show DAODISEO endpoints
        run: |
          echo "RPC:" && jq -r '.apis.rpc[].address' daodiseo/chain.json
          echo "REST:" && jq -r '.apis.rest[].address' daodiseo/chain.json

      - name: Run tests (DAODISEO only)
        run: pytest -n auto .github/workflows/tests -k daodiseo -vv -s
